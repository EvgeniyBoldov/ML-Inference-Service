services:
  inference-service:
    image: "${REGISTRY}/${IMAGE}:${RELEASE_VERSION}"
    restart: unless-stopped
    env_file:
      - /etc/ml-inference-service/runtime.env
    environment:
      RELEASE_VERSION: "${RELEASE_VERSION}"
      RELEASE_COMMIT: "${RELEASE_COMMIT}"
      INFERENCE_TOKEN_FILE: /etc/ml-inference-service/tokens
    # Docker socket access is root-equivalent. This container is intentionally
    # root because it creates isolated fleet runtime containers.
    user: "0:0"
    volumes:
      - /etc/ml-inference-service:/etc/ml-inference-service:ro
      - /var/lib/ml-inference-service/model-artifacts:/var/lib/ml-inference-service/model-artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - runtime
    ports:
      - "127.0.0.1:${SLOT_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

networks:
  runtime:
    name: ml-inference-runtime
    external: true
