services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: ml_inference
      POSTGRES_USER: ml_inference
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  inference-service:
    build:
      context: ../..
      dockerfile: apps/inference-service/Dockerfile.dev
    restart: unless-stopped
    environment:
      INFERENCE_DATABASE_URL: postgresql+asyncpg://ml_inference:local-only-password@postgres:5432/ml_inference
      INFERENCE_TRUSTED_PROXY_AUTH: "true"
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MODEL_ARTIFACT_CACHE_ROOT: ${MODEL_ARTIFACT_CACHE_ROOT:-}
      MODEL_FLEET_MEMORY_LIMIT: ${MODEL_FLEET_MEMORY_LIMIT:-}
      MODEL_FLEET_CPU_LIMIT: ${MODEL_FLEET_CPU_LIMIT:-}
      MODEL_FLEET_DOCKER_NETWORK: ml-inference-local-runtime
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../.local/model-artifacts:/var/lib/ml-inference-service/model-artifacts
    networks:
      - control
      - runtime
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  dashboard:
    build:
      context: ../../apps/inference-service/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - control
    depends_on:
      inference-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/dashboard/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  control:
    name: ml-inference-local-control
  runtime:
    name: ml-inference-local-runtime

volumes:
  postgres-data:
    name: ml-inference-local-postgres-data
