# Installed once on the production VM as /etc/nginx/conf.d/ml-inference-service.conf.
# TLS files are provisioned by the host certificate automation; the deployment
# job owns only the included API upstream file atomically.
include /etc/nginx/conf.d/ml-inference-service-upstream.conf;

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ml-inference-service/tls/fullchain.pem;
    ssl_certificate_key /etc/ml-inference-service/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prometheus scrapes the loopback container port with a deploy token. Metrics
    # must not become an unauthenticated public endpoint through this proxy.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://ml_inference_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
    }
}
