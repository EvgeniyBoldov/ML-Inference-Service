# Installed once on the production VM as /etc/nginx/conf.d/ml-inference-service.conf.
# The deployment job owns the included upstream file atomically.
include /etc/nginx/conf.d/ml-inference-service-upstream.conf;

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://ml_inference_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
