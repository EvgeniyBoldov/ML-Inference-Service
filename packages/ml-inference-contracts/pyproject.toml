[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-inference-contracts"
version = "0.1.0"
description = "MLflow publishing and ML Inference Service deployment contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mlflow = ["mlflow>=2.12,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_inference_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

