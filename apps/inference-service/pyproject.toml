[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-inference-service"
version = "0.1.0"
description = "OpenAI-style MLflow-backed inference service"
readme = "README.md"
requires-python = ">=3.12"
# Production dependencies live in projects/model-runtime-base/requirements.txt.
# This file provides package metadata and local test tooling only.

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
