# Example production pipeline; keep in sync with .gitlab-ci.yml.
stages:
  - test
  - deploy

test_service:
  stage: test
  tags: [production-shell]
  script:
    - bash -n scripts/release.sh scripts/release-common.sh scripts/deploy.sh scripts/production-controller.sh
    - bash -c 'source scripts/release-common.sh; load_release_file release.env'
    - python3 -m unittest discover -s scripts/tests -q
    - PYTHONPATH=apps/inference-service python3 -m unittest discover -s apps/inference-service/tests -p test_delivery_logging.py -q
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_production:
  stage: deploy
  tags:
    - production-shell
  resource_group: ml-inference-service-production
  needs: [test_service]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - release.env
        - infra/compose/inference-service.compose.yaml
        - scripts/deploy-production.sh
        - scripts/release-common.sh
        - scripts/deploy.sh
        - scripts/production-controller.sh
  script:
    - test -f release.env
    - test -f infra/compose/inference-service.compose.yaml
    - bash scripts/deploy-production.sh
  environment:
    name: production
  after_script:
    - sudo --non-interactive /usr/local/sbin/ml-inference-deploy status > deployment-status.env || true
  artifacts:
    when: always
    paths: [deployment-status.env]

rollback_production:
  stage: deploy
  tags: [production-shell]
  resource_group: ml-inference-service-production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - sudo --non-interactive /usr/local/sbin/ml-inference-deploy rollback
  environment:
    name: production
